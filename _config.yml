remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme

title: "My Portfolio"
description: "A showcase of my projects and skills"
profile_picture: "/assets/images/profile.jpg"
baseurl: "/my-portfolio-site" # Replace with your repo name if hosted on GitHub Pages; otherwise, use ""
url: "https://your-username.github.io" # Replace with your GitHub Pages URL or custom domain

author:
